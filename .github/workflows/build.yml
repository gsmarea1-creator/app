name: Build Windows KVM
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Windows
        run: npm run build:win

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/
